- id: '1792000000001'
  alias: Hoflicht Override Auto-Reset
  description: Setzt input_boolean.hoflicht_override nach 2h bzw. nach HA-Neustart
    zurück, damit 'Hoflicht aus bei keiner Bewegung' nicht dauerhaft blockiert ist.
    Schaltet das Licht aus, wenn beide Bewegungsmelder seit 10 min frei sind.
  triggers:
  - trigger: state
    entity_id: input_boolean.hoflicht_override
    to: 'on'
    for:
      hours: 2
      minutes: 0
      seconds: 0
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.hoflicht_override
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hoflicht_override
  - if:
    - condition: state
      entity_id: light.gard_mainhouse_floodligt
      state: 'on'
    - condition: state
      entity_id: binary_sensor.0x001788010ebadd57_occupancy
      state: 'off'
      for:
        minutes: 10
    - condition: state
      entity_id: binary_sensor.bewegungsmelder_occupancy
