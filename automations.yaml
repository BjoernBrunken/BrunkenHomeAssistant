- id: party_modus_on
  alias: Party Modus – Start
  description: Startet Colorloop mit goldenen Winkel-Startfarben auf allen 14 Küchen-Spots
    via MQTT
  triggers:
  - trigger: state
    entity_id: input_boolean.party_modus
    to: 'on'
  conditions: []
  actions:
  - repeat:
      count: 14
      sequence:
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/MainHouse-Kitchen_{{ repeat.index }}/set
          payload: '{{ {''color'': {''h'': (((repeat.index - 1) * 137.508) % 360)
            | int, ''s'': 100}, ''brightness'': 200, ''effect'': ''colorloop''} |
            to_json }}'
      - delay: '00:00:00.2'
  mode: single
- id: party_modus_off
  alias: Party Modus – Stop
  description: Stoppt Colorloop und stellt Kochszene wieder her
  triggers:
  - trigger: state
    entity_id: input_boolean.party_modus
    to: 'off'
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id: light.mainhouse_kitchen_grp
    data:
      effect: stop_effect
  - delay: 00:00:01
  - action: scene.turn_on
    target:
      entity_id: scene.kochen
  mode: single
