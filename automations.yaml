- id: badtunna_6h
  alias: Badtunna – Pumpe 6 Stunden
  description: Pumpe manuell 6 Stunden einschalten; zweiter Druck stoppt sofort
  triggers:
  - trigger: state
    entity_id: input_button.badtunna_6h
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.garden_badtunna_pump
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.badtunna_override
      - action: switch.turn_on
        target:
          entity_id: switch.garden_badtunna_pump
      - delay:
          hours: 6
          minutes: 0
          seconds: 0
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.badtunna_override
      - action: switch.turn_off
        target:
          entity_id: switch.garden_badtunna_pump
    - conditions:
      - condition: state
        entity_id: switch.garden_badtunna_pump
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.badtunna_override
      - action: switch.turn_off
        target:
          entity_id: switch.garden_badtunna_pump
  mode: restart
