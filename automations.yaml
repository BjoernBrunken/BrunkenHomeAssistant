- id: '1792000000010'
  alias: Holzvergaser Temperaturwarnung
  description: 'Warnt, wenn die Kesseltemperatur 5 min über der Warnschwelle liegt
    (≈ 2 Messwerte, filtert Einzel-Ausreißer), sofort über der kritischen Schwelle,
    und wenn der Kesselfühler 30 min nichts sendet. Schwellen aus Historie 2023–2026
    abgeleitet: Warnung 95 °C (oberste 0,2 % der Zeit), kritisch 98 °C (seit März
    2026 nie dauerhaft erreicht).'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.holzvergaser_kesseltemperatur
    above: input_number.holzvergaser_warnschwelle
    for:
      minutes: 5
    id: warn
  - trigger: numeric_state
    entity_id: sensor.holzvergaser_kesseltemperatur
    above: input_number.holzvergaser_kritische_schwelle
    id: kritisch
  - trigger: state
    entity_id: sensor.holzvergaser_kesseltemperatur
    to: unavailable
    id: ausfall
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: kritisch
      sequence:
      - action: script.heizung_benachrichtigen
        data:
          kritisch: true
          titel: "\U0001F525 Holzvergaser KRITISCH"
          nachricht: Kessel {{ states('sensor.holzvergaser_kesseltemperatur') }} °C
            – über der kritischen Schwelle von {{ states('input_number.holzvergaser_kritische_schwelle')
            | int }} °C!
    - conditions:
      - condition: trigger
        id: warn
      - condition: numeric_state
        entity_id: sensor.holzvergaser_kesseltemperatur
        below: input_number.holzvergaser_kritische_schwelle
      sequence:
      - action: script.heizung_benachrichtigen
        data:
          kritisch: false
          titel: Holzvergaser warm
          nachricht: Kessel {{ states('sensor.holzvergaser_kesseltemperatur') }} °C
            – über der Warnschwelle von {{ states('input_number.holzvergaser_warnschwelle')
            | int }} °C.
    - conditions:
      - condition: trigger
        id: ausfall
      - condition: template
        value_template: '{{ trigger.from_state is not none and trigger.from_state.state
          | is_number }}'
      sequence:
      - action: script.heizung_benachrichtigen
        data:
          kritisch: false
          tag: holzvergaser_fuehler
          titel: Kesselfühler ausgefallen
          nachricht: Seit 30 Minuten kein Wert vom Kesselfühler (zuletzt {{ trigger.from_state.state
            }} °C). Gateway, maserver oder Sensor-Batterie prüfen.
  mode: queued
- id: '1792000000011'
  alias: 'Bad: Licht an → warmweiß 40 % + Groove Salad'
  description: 'Wenn das Bad-Licht angeht (Schalter, App oder Dashboard): Spots auf
    warmweiß 2700 K / 40 % und MoOde-Player (media_player.terasse_radio, steht jetzt
    im Bad) spielt SomaFM Groove Salad. Licht aus → Musik aus. Ausnahme: Wurde das
    Licht durch eine der Bad-Szenen eingeschaltet, bleibt die Szenenfarbe.'
  triggers:
  - trigger: state
    entity_id: light.mainhouse_bath_grp
    from: 'off'
    to: 'on'
    id: an
  - trigger: state
    entity_id: light.mainhouse_bath_grp
    from: 'on'
    to: 'off'
    id: aus
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: an
      sequence:
      - if:
        - condition: template
          value_template: '{{ expand(''scene.bad_pfirsich'',''scene.bad_warmweiss'',''scene.bad_apricot'',''scene.bad_rose'',''scene.bad_himmelblau'')
            | map(attribute=''state'') | reject(''in'',[''unknown'',''unavailable''])
            | map(''as_datetime'') | select(''gt'', now() - timedelta(seconds=5))
            | list | count == 0 }}'
        then:
        - action: light.turn_on
          target:
            entity_id: light.mainhouse_bath_grp
          data:
            brightness_pct: 40
            color_temp_kelvin: 2700
      - action: media_player.play_media
        continue_on_error: true
        target:
          entity_id: media_player.terasse_radio
        data:
          media_content_id: https://ice2.somafm.com/groovesalad-256-mp3
          media_content_type: music
    - conditions:
      - condition: trigger
        id: aus
      - condition: state
        entity_id: media_player.terasse_radio
        state:
        - playing
        - paused
      sequence:
      - action: media_player.media_stop
        target:
          entity_id: media_player.terasse_radio
  mode: restart
