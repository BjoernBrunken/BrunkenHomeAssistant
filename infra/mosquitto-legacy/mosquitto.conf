# Legacy-Broker auf der alten Pi-IP 192.168.68.66.
# Nimmt die Daten der ESP32s (IP fest eingetragen) an und reicht alles an den Haupt-Broker auf unraid weiter.
listener 1883
allow_anonymous true
persistence false
log_dest stdout

connection unraid-main
address 192.168.68.100:1883
topic # out 0
start_type automatic
cleansession true
try_private true
bridge_protocol_version mqttv311
